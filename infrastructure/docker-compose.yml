version: "3.9"

networks:
  kultura-net:
    driver: bridge

services:
  service-discovery:
    build:
      context: ../backend
      dockerfile: service-discovery/Dockerfile
    container_name: service-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kultura-net

  api-gateway:
    build:
      context: ../backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kultura-net

  identity:
    build:
      context: ../backend
      dockerfile: identity/Dockerfile
    container_name: identity
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kultura-net

  catalog-db:
    image: postgres:15-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks:
      - kultura-net

  catalog-service:
    build:
      context: ../backend
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-service
    depends_on:
      service-discovery:
        condition: service_healthy
      catalog-db:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SERVER_PORT: 8082
      CATALOG_DB_URL: jdbc:postgresql://catalog-db:5432/catalog
      CATALOG_DB_USERNAME: catalog
      CATALOG_DB_PASSWORD: catalog
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kultura-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: kultura-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      # Point frontend API calls to the gateway container (adjust if needed)
      NEXT_PUBLIC_API_BASE_URL: http://api-gateway:8080
    ports:
      - "3000:3000"
    networks:
      - kultura-net

volumes:
  catalog-db-data:

